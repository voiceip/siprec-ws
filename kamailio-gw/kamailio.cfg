##
## kamailio.cfg  –  SIPREC SIP Filtering Gateway
##
## Role: Sits in front of siprec-ws. Applies regex filters to SIP headers.
##       Allowed calls are forwarded statefully to siprec-ws.
##       Rejected calls are silently dropped (no SIP response to the PBX).
##
## ── Destination (edit these two lines to change where calls are forwarded) ──
##
##   SIPREC_WS_HOST  IP or hostname of siprec-ws-bridge
##   SIPREC_WS_PORT  SIP port that siprec-ws-bridge listens on
##
## VM deployment (default): both run on the same host.
##   siprec-ws-bridge is on 127.0.0.1:5080 so Kamailio can own port 5060.
##

#!KAMAILIO

#!define SIPREC_WS_HOST "127.0.0.1"
#!define SIPREC_WS_PORT "5080"

##############################################################################
## Global parameters
##############################################################################

children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# Increase limits for SIPREC multipart bodies (SDP + rs-metadata+xml can
# reach 8-10 KB; 32 KB is a safe ceiling).
tcp_max_msg_size=32768
max_len=32768

# Logs go to syslog/journald (view with: journalctl -u kamailio -f).
# Set log_stderror=yes if running in Docker (docker logs).
log_stderror=no
log_facility=LOG_LOCAL0
debug=2

dns=no
rev_dns=no

##############################################################################
## Module loading
##############################################################################

# Debian/Ubuntu native install path. Alpine (Docker) uses /usr/lib/kamailio/modules/.
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "tm.so"       # stateful transaction management (required for t_relay)
loadmodule "tmx.so"
loadmodule "rr.so"       # record-route so BYE/re-INVITE traverse this proxy
loadmodule "sl.so"       # stateless replies (100 Trying, OPTIONS 200, errors)
loadmodule "textops.so"  # re_match() for regex header filtering
loadmodule "siputils.so" # is_method(), has_totag(), loose_route()
loadmodule "maxfwd.so"   # Max-Forwards check

##############################################################################
## Module parameters
##############################################################################

modparam("tm", "fr_timer",     30)    # Final response timer (seconds)
modparam("tm", "fr_inv_timer", 120)   # INVITE final response timer (seconds)

modparam("rr", "enable_double_rr", 1)
modparam("rr", "add_username", 0)

##############################################################################
##
##  ┌──────────────────────────────────────────────────────────────────────┐
##  │                        FILTER RULES                                  │
##  │                                                                      │
##  │  Logic: OR  – a call is ALLOWED if ANY rule below matches.           │
##  │  If NO rule matches the INVITE is silently drop()ed.                 │
##  │                                                                      │
##  │  How to add a rule (copy a block, uncomment, edit the pattern):      │
##  │                                                                      │
##  │    if (re_match("<pseudo-var>", "<POSIX-ERE-pattern>")) {            │
##  │        route(RELAY);                                                 │
##  │    }                                                                 │
##  │                                                                      │
##  │  Useful pseudo-variables:                                            │
##  │    $rU  – Request-URI user part only  (e.g. "61378")                 │
##  │    $tU  – To URI user part only                                      │
##  │    $fU  – From URI user part only                                    │
##  │    $ru  – Full Request-URI  (e.g. "sip:61378@pbx.company.com")       │
##  │    $tu  – Full To URI                                                │
##  │    $fu  – Full From URI                                              │
##  │    $si  – Source IP of the incoming SIP packet                       │
##  │                                                                      │
##  │  re_match() uses POSIX Extended Regular Expressions.                 │
##  └──────────────────────────────────────────────────────────────────────┘
##
##############################################################################

##############################################################################
## Main routing block
##############################################################################

request_route {

    ## 1. Loop / hop count protection.
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    ## 2. In-dialog requests (BYE, ACK, re-INVITE, etc.).
    ##    These are handled by the Record-Route mechanism – just relay them.
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else {
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    ## 3. OPTIONS keep-alives (e.g. from Avaya Session Manager).
    ##    Reply 200 locally so siprec-ws never sees this traffic.
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    ## 4. Ignore anything that is not an INVITE (no response – silent drop).
    if (!is_method("INVITE")) {
        drop();
        exit;
    }

    ## 5. Send 100 Trying immediately.
    ##    Stops the PBX from retransmitting while filters are evaluated.
    ##    Remove this line if the proxy must be invisible on untrusted networks.
    sl_send_reply("100", "Trying");

    ## ─────────────────────────────────────────────────────────────────────
    ## 6. FILTER EVALUATION (OR logic)
    ##    Each rule independently calls route(RELAY) and exits on a match.
    ##    Execution reaching step 7 means no rule matched → drop.
    ## ─────────────────────────────────────────────────────────────────────

    # Rule: allow specific VDNs only
    if (re_match("$rU", "^(60299)$")) {
        route(RELAY);
    }

    # Rule: allow calls from a specific SIP domain.
    # if (re_match("$fu", "@example\\.com")) {
    #     route(RELAY);
    # }

    # Rule: allow a specific source IP.
    # if ($si == "10.0.1.50") {
    #     route(RELAY);
    # }

    ## ── ADD YOUR OWN RULES ABOVE THIS LINE ──────────────────────────────

    ## 7. No rule matched – silently discard.
    xlog("L_INFO", "SIPREC INVITE from $si to $rU did not match any filter – dropping\n");
    drop();
    exit;
}

##############################################################################
## RELAY route – record-route + stateful forward to siprec-ws
##############################################################################

route[RELAY] {

    # Insert Record-Route so subsequent in-dialog requests (BYE, re-INVITE)
    # also traverse this proxy and are handled correctly.
    record_route();

    # Rewrite the Request-URI to point at siprec-ws-bridge.
    # Destination is controlled by SIPREC_WS_HOST / SIPREC_WS_PORT at the
    # top of this file. The user part (dialled number) is preserved so
    # siprec-ws sees the original called party.
    $ru = "sip:" + $rU + "@SIPREC_WS_HOST:SIPREC_WS_PORT";

    # Stateful relay: forwards the full SIP message (including the multipart
    # body with SDP + rs-metadata+xml) unchanged to siprec-ws.
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

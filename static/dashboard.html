<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPREC WS Bridge</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #1a1a1a; color: #e0e0e0; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    .stats { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat { background: #2a2a2a; padding: 0.75rem 1rem; border-radius: 6px; min-width: 120px; }
    .stat span { display: block; font-size: 1.5rem; font-weight: 600; color: #7dd3fc; }
    .stat label { font-size: 0.75rem; text-transform: uppercase; opacity: 0.8; }
    table { width: 100%; border-collapse: collapse; background: #2a2a2a; border-radius: 6px; overflow: hidden; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #333; font-size: 0.75rem; text-transform: uppercase; }
    tr:nth-child(even) { background: #252525; }
    .meta { font-size: 0.85rem; }
    #calls:empty::after { content: 'No active calls'; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>SIPREC WS Bridge</h1>
  <div class="stats">
    <div class="stat"><label>Active calls</label><span id="activeCount">0</span></div>
    <div class="stat"><label>WS connections</label><span id="wsCount">0</span></div>
  </div>
  <table>
    <thead><tr><th>Call ID</th><th>Start</th><th>Legs</th><th>WS</th></tr></thead>
    <tbody id="calls"></tbody>
  </table>
  <script>
    function refresh() {
      fetch('/debug/calls').then(r => r.json()).then(data => {
        document.getElementById('activeCount').textContent = data.length;
        document.getElementById('wsCount').textContent = data.length;
        const tbody = document.getElementById('calls');
        tbody.innerHTML = data.map(c => '<tr><td>' + c.callId + '</td><td>' + new Date(c.startTime).toISOString() + '</td><td>' + c.legs + '</td><td>' + (c.wsConnected ? 'Yes' : 'No') + '</td></tr>').join('') || '';
      }).catch(() => {});
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
